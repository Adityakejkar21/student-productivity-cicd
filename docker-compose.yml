version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - mern-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/merndb
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret}
    depends_on:
      - mongo
    restart: always
    networks:
      - mern-network

  mongo:
    image: mongo:7
    container_name: mern-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - mern-network

volumes:
  mongo-data:

networks:
  mern-network:
    driver: bridge
